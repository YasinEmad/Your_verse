services:
  postgres:
    image: postgres:16-alpine
    container_name: yourverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yourverse
      POSTGRES_USER: yourverse_user
      POSTGRES_PASSWORD: yourverse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yourverse_user -d yourverse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
